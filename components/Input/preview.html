  </div>

  <div class="field">
    <label class="lbl" for="p-search">With trailing icon</label>

      <input id="p-search" type="text" placeholder="Search holdings or tickers…">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    </div>
  </div>

  <div class="field">
    <label class="lbl" for="p-msg">Message</label>
    <div class="input area"><textarea id="p-msg" rows="2" placeholder="Add any notes for this payout configuration…"></textarea></div>
    <p class="help caption">Visible to anyone with access to this account.</p>

  <div class="field">
    <label class="lbl" for="p-focus">Focused</label>
    <div class="input is-focus"><input id="p-focus" type="text" value="artist@studio.inc"></div>
