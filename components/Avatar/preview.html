<div class="wrap">
  <div class="row">
    <span class="av sm"><span class="ini">MF</span></span>
    <span class="av"><span class="ini">MF</span></span>
    <span class="av lg"><span class="ini">MF</span></span>
    <span class="cap">24 · 32 · 40</span>
  </div>

  <div class="row">
    <span class="av"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></span>
    <span class="av"><span class="ini">JO</span></span>

  <div class="stack">
    <span class="av ring"><span class="ini">MF</span></span>
    <span class="av ring"><span class="ini">JO</span></span>

</div>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  .wrap {
    background: var(--background); color: var(--foreground);
    padding: var(--space-20); display: flex; flex-direction: column; gap: var(--space-16);
  }
  .row { display: flex; align-items: center; gap: var(--space-8); }
  .stack { display: flex; }

  .av {
    width: var(--size-32); height: var(--size-32); flex: none;
    display: grid; place-content: center; overflow: hidden;
    border-radius: var(--radius-full);
    background: var(--muted); color: var(--muted-foreground);
    box-shadow: var(--shadow-hairline);
  }
  .sm { width: var(--size-24); height: var(--size-24); }
  .lg { width: var(--size-40); height: var(--size-40); }

  .ini {
    font-family: var(--font-sans); font-size: 12px; line-height: var(--size-16); font-weight: 500;
  }
  .lg .ini { font-size: 14px; line-height: var(--size-20); }
  .av svg {
    width: var(--size-16); height: var(--size-16); fill: none; stroke: currentColor;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  }

  /* In a stack the hairline is replaced by a 2px ring in the page colour,

  .ring { box-shadow: 0 0 0 2px var(--ring-offset); }
  .ring + .ring { margin-left: -8px; }
  .more { background: var(--secondary); color: var(--secondary-foreground); }

  .cap {
    font-family: var(--font-sans); font-size: 12px; line-height: var(--size-16);
    color: var(--muted-foreground);
  }
</style>
