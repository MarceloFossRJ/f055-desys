<!-- @dsCard group="Overlays" height=440 subtitle="The tooltip's geometry, with interactive content" -->
<div class="wrap">
  <div class="col">
    <span class="cap">Tooltip — the reference's own instance</span>
    <div class="tip">
      <span class="swatch"></span>
      <span class="tl">Visitors</span>
      <span class="tv">237</span>
    </div>
  </div>

  <div class="col">
    <span class="cap">Popover — interactive content</span>
    <div class="pop">
      <div class="phd">
        <span class="pt">Payout threshold</span>
        <button class="x" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      </div>
      <p class="pb">Payouts run once your balance clears this amount. Changes apply from
        the next cycle.</p>
      <div class="pf">
        <button class="gb">Cancel</button>
        <button class="gb pri">Save</button>
      </div>
    </div>
  </div>

  <div class="col">
    <span class="cap">Menu — the same shell as Select's panel</span>
    <div class="pop menu">
      <div class="opt">Edit details</div>
      <div class="opt">Duplicate</div>
      <div class="sep"></div>
      <div class="opt dang">Delete</div>
    </div>
  </div>
</div>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  .wrap {
    background: var(--background); color: var(--foreground);
    padding: var(--space-20); display: flex; flex-direction: column; gap: var(--space-16);
  }
  .col { display: flex; flex-direction: column; gap: var(--space-6); align-items: flex-start; }
  .cap {
    font-family: var(--font-sans); font-size: 12px; line-height: var(--size-16);
    color: var(--muted-foreground);
  }

  .tip {
    display: flex; align-items: center; gap: var(--space-8); min-width: 128px;
    background: var(--popover); color: var(--popover-foreground);
    border-radius: var(--radius-14); box-shadow: var(--shadow-overlay);
    padding: var(--space-6) var(--space-10);
  }
  .swatch { width: var(--size-4); align-self: stretch; border-radius: 2px; background: var(--series-1); }
  .tl {
    flex: 1; font-family: var(--font-sans); font-size: 12px; line-height: 1;
    color: var(--muted-foreground);
  }
  .tv {

    font-variant-numeric: tabular-nums;
  }

    border-radius: var(--radius-14); box-shadow: var(--shadow-overlay);
    padding: var(--space-16); max-width: 300px;
    display: flex; flex-direction: column; gap: var(--space-12);
  }
  .menu { padding: var(--space-6); gap: var(--space-2); min-width: 180px; }

  .phd { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-12); }
  .pt { font-family: var(--font-sans); font-size: 14px; line-height: 19.25px; font-weight: 500; }
  .x {
