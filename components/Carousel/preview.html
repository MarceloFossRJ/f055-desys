<!-- @dsCard group="Display" height=420 subtitle="Slides, edge controls, and a dot index" -->
<div class="wrap">
  <div class="car">
    <div class="viewport">
      <div class="slide cur">
        <span class="eyebrow">Retirement</span>
        <span class="amt">$420,000</span>
        <span class="sub">65% achieved · $273,000</span>
      </div>
      <div class="slide next">
        <span class="eyebrow">Real Estate</span>
        <span class="amt">$85,000</span>
      </div>
    </div>

    <button class="nav prev" aria-label="Previous slide">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <button class="nav next-b" aria-label="Next slide">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
    </button>
  </div>

  <div class="dots" role="tablist" aria-label="Slide">
    <button class="dot on" aria-label="Slide 1" aria-selected="true"></button>
    <button class="dot" aria-label="Slide 2" aria-selected="false"></button>
    <button class="dot" aria-label="Slide 3" aria-selected="false"></button>
    <button class="dot is-focus" aria-label="Slide 4" aria-selected="false"></button>
  </div>
</div>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  .wrap {
    background: var(--background); color: var(--foreground);
    padding: var(--space-20); display: flex; flex-direction: column; gap: var(--space-12);
  }
  .car { position: relative; }
  .viewport { display: flex; gap: var(--space-16); overflow: hidden; }

  .slide {
    flex: none; width: 260px;
    display: flex; flex-direction: column; gap: var(--space-4);
    background: var(--muted); border-radius: var(--radius-14); padding: var(--space-16);
  }
  .cur { opacity: 1; }
  .next { opacity: .5; }
  .eyebrow {
    font-family: var(--font-sans); font-size: 12px; line-height: 16px; font-weight: 500;
    text-transform: uppercase; color: var(--muted-foreground);
  }
  .amt {
    font-family: var(--font-sans); font-size: 30px; line-height: 36px; font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .sub {
    font-family: var(--font-sans); font-size: 14px; line-height: 20px;
    color: var(--muted-foreground); font-variant-numeric: tabular-nums;
  }

  .nav {
    position: absolute; top: 50%; translate: 0 -50%;
    width: 28px; height: 28px; display: grid; place-content: center; cursor: pointer;
    border: 0; border-radius: var(--radius-pill);
    background: var(--card); color: var(--foreground); box-shadow: var(--shadow-overlay);
  }
  .prev { left: calc(var(--space-8) * -1); }
  .next-b { right: calc(var(--space-8) * -1); }
  .nav svg {
    width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round;
  }

  .dots { display: flex; justify-content: center; gap: var(--space-6); }
  .dot {
    width: 6px; height: 6px; padding: 0; cursor: pointer;
    border: 0; border-radius: var(--radius-full); background: var(--track);
  }
  .dot.on { background: var(--foreground); }
  .is-focus { box-shadow: 0 0 0 2px var(--ring-offset), 0 0 0 4px var(--ring); }
</style>
