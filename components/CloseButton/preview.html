<!-- @dsCard group="Actions" height=260 subtitle="28px muted circle, in the card header grid" -->
<div class="wrap">
  <div class="card">
    <div class="hd">
      <p class="t">Payout Threshold</p>
      <p class="s">Set the minimum balance required before a payout is triggered.</p>
      <button class="x" aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
  </div>

  <div class="row">
    <button class="x" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    <span class="cap">Default</span>
    <button class="x is-focus" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    <span class="cap">Focused</span>
    <button class="x bare" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    <span class="cap">On a filled surface</span>
  </div>
</div>
<style>
  .wrap {
    background: var(--background); color: var(--foreground);
    padding: var(--space-20); display: flex; flex-direction: column; gap: var(--space-20);
  }
  .card {
    background: var(--card); color: var(--card-foreground);
    border-radius: var(--radius-24); box-shadow: var(--shadow-card);
    padding-block: var(--space-20);
  }
  .hd {
    display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto auto;
    gap: var(--space-6); padding-inline: var(--space-20); align-items: start;
  }
  .t { margin: 0; font-family: var(--font-sans); font-size: 16px; line-height: 24px; font-weight: 500; }
  .s { margin: 0; font-family: var(--font-sans); font-size: 14px; line-height: 20px; color: var(--muted-foreground); }

  .x {
    width: 28px; height: 28px; display: grid; place-content: center; cursor: pointer;
    border: 1px solid transparent; border-radius: var(--radius-pill);
    background: var(--muted); color: var(--foreground);
    grid-column: 2; grid-row: 1 / span 2; justify-self: end; align-self: start;
  }
  .x svg {
    width: 16px; height: 16px; fill: none; stroke: currentColor;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  }
  .bare { background: transparent; }
  .is-focus { box-shadow: 0 0 0 2px var(--ring-offset), 0 0 0 4px var(--ring); }

  .row { display: flex; align-items: center; gap: var(--space-8); flex-wrap: wrap; }
  .row .x { grid-column: auto; grid-row: auto; justify-self: auto; }
  .cap {
    font-family: var(--font-sans); font-size: 12px; line-height: 16px;
    color: var(--muted-foreground); margin-right: var(--space-8);
  }
</style>
