name: tokens

# dist/ is generated AND committed, so the two can drift silently: someone
# hand-edits a file under dist/, or changes tokens/ without rebuilding, and a
# consuming stack quietly picks up stale values. This job makes that a failing
# build instead of a mystery.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # No dependencies: build_tokens.py is standard library only.
      - name: Rebuild generated outputs
        run: python3 scripts/build_tokens.py

      - name: Fail if dist/ is out of date
        run: |
          if [ -n "$(git status --porcelain dist/)" ]; then
            echo "::error::dist/ does not match tokens/. Run 'python3 scripts/build_tokens.py' and commit the result."
            git --no-pager diff --stat dist/
            git --no-pager diff dist/
            exit 1
          fi
          echo "dist/ is in sync with tokens/"

      - name: Validate component previews
        run: python3 scripts/check_tokens.py

      # Every rule this enforces was found by rendering a screen and measuring
      # the live DOM. A rule that is only written down gets broken again, so it
      # is a build gate instead. Here it covers the previews; the `screens` job
      # below builds the examples and covers the real pages.
      - name: Measure text contrast in the component previews
        run: python3 scripts/check_contrast.py

      # examples/login-compose is never compiled -- there is no Kotlin
      # toolchain here. This is the part a design system is responsible for:
      # every token the Compose source names must exist in dist/kotlin.
      - name: Check Kotlin token references
        run: python3 scripts/check_kotlin_tokens.py

      # dist/kotlin and dist/swift are the two outputs nothing executes. This
      # compares their numbers against the flat token file -- a different code
      # path, through px(), dp/sp conversion and ARGB packing, which is where a
      # unit slip or a dropped alpha channel would live.
      - name: Check Kotlin and Swift token values
        run: python3 scripts/check_native_values.py

  # Compose is the one stack that cannot be verified in the sandbox this repo is
  # developed in: Maven Central, JetBrains Space and the JetBrains CDN are all
  # refused at the proxy. Here they are reachable, so this job does what the
  # sandbox cannot -- compiles the generated Kotlin, lays the screen out, and
  # asserts its geometry against the tokens.
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the tokens the Compose source compiles against
        run: python3 scripts/build_tokens.py

      # Compiles dist/kotlin/*.kt as part of the module, so a generator that
      # emits Kotlin which does not compile fails here and nowhere else.
      - name: Compile and render the Compose login
        working-directory: examples/login-compose
        run: ./gradlew --no-daemon :composeApp:desktopTest

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compose-login-renders
          path: examples/login-compose/composeApp/build/reports/f055/*.png
          if-no-files-found: error

  # The specs being accessible says nothing about the screens assembled from
  # them. This job builds both examples and measures the pages themselves --
  # Tailwind's real output, React's and Jinja's real markup.
  screens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build the Next.js example
        working-directory: examples/dashboard-next
        run: npm ci && npm run build

      - name: Build the Jinja example
        working-directory: examples/dashboard-jinja
        run: |
          python3 -m pip install -r requirements.txt httpx
          npm ci
          npm run build
          python3 snapshot.py out

      # Rails itself is not installed: the views are real Rails views and
      # render.rb supplies the handful of ActionView methods they use, so the
      # output can still be measured. See that example's README.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Render the Rails views
        working-directory: examples/login-rails
        run: |
          npm ci
          npm run build
          ruby render.rb out

      # Fails if a screen's stylesheet did not parse, so a clean pass cannot be
      # a silent one.
      - name: Measure text contrast in every screen
        run: python3 scripts/check_contrast.py
